<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arty – Plataforma de Vídeos Curtos para Arte</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="imagens/logo.png" alt="Arty Logo" width="64" height="64">
    </div>
  </header>

  <main>
    <div class="login-card">
      <form id="loginForm">
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

        <button type="submit">Entrar / Cadastrar</button><br><br>
        <button type="button" id="btnContinuar">Continuar sem uma conta</button>
      </form>
    </div>

    <div class="hero">
      <h1>Descubra arte em movimento. Assista, crie e inspire.</h1>
    </div>

    <div class="search-wrapper">
      <input type="text" placeholder="Buscar arte, artistas, estilos..." id="searchInput">
    </div>
  </main>

  <button class="help-btn" title="Sobre Nós" id="btnAjuda">?</button>

  <footer>
    <div>© 2026 Arty – Plataforma de Vídeos Curtos para Arte.</div>
    
    <div style="margin-top: 10px; text-align: center;">
      <img src="imagens/logoifc.png" alt="Instituto Federal" width="40" height="40">
      <p style="font-size: 11px; margin-top: 4px;">Instituto Federal Campus Concórdia</p>
    </div>
  </footer>

  <script src="JS/script.js"></script>

</body>
</html>
