<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arty - Perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-perfil">

  <aside class="perfil-sidebar">
    <div class="perfil-logo">
      <img src="imagens/logo.png" alt="Arty Logo">
    </div>

    <nav>
      <button onclick="window.location.href='exposicoes.html'">Explorar</button>
      <button class="ativo">Perfil</button>
      <button>Mensagens</button>
      <button onclick="window.location.href='criar.html'">Criar</button>
      <button>Configurações</button>
    </nav>

    <button class="btn-ajuda">Ajuda</button>
  </aside>

  <main class="perfil-main">

    <header class="perfil-header">
      <button class="btn-voltar" onclick="window.location.href='exposicoes.html'">
        ← Voltar
      </button>

      <h1>Meu Perfil</h1>
    </header>

    <section class="perfil-info">

      <div class="foto-perfil">
        <div class="avatar">A</div>
      </div>

      <div class="dados-perfil">
        <h2>@artista_arty</h2>
        <p class="descricao">
          Artista visual | Criando e compartilhando arte.
        </p>

        <div class="estatisticas">
          <div>
            <strong>34K</strong>
            <span>Curtidas</span>
          </div>

          <div>
            <strong>4K</strong>
            <span>Seguidores</span>
          </div>

          <div>
            <strong>85</strong>
            <span>Seguindo</span>
          </div>
        </div>

        <button class="btn-editar">Editar perfil</button>
      </div>

    </section>

    <section class="minhas-artes">

      <div class="titulo-artes">
        <h2>Minhas Artes</h2>
        <span>3 publicações</span>
      </div>


       <div class="galeria">

        <div class="arte">
            <video controls>
            <source src="imagens/video1.mp4" type="video/mp4">
            </video>
        </div>

        <div class="arte">
            <video controls>
            <source src="imagens/video2.mp4" type="video/mp4">
            </video>
        </div>

        <div class="arte">
            <video controls>
            <source src="imagens/video3.mp4" type="video/mp4">
            </video>
        </div>

        </div>

    </section>

  </main>

</body>
</html>
