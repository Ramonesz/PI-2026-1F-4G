<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arty - Criar</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-criar">

  <aside class="criar-sidebar">

    <div class="criar-logo">
      <img src="imagens/logo.png" alt="Arty Logo">
    </div>

    <nav>
      <button onclick="window.location.href='exposicoes.html'">
        Explorar
      </button>

      <button onclick="window.location.href='perfil.html'">
        Perfil
      </button>

      <button>
        Mensagens
      </button>

      <button class="ativo">
        Criar
      </button>

      <button>
        Configurações
      </button>
    </nav>

    <button>Ajuda</button>

  </aside>


  <main class="criar-main">

    <header class="criar-header">

      <button
        class="btn-voltar-criar"
        onclick="window.location.href='exposicoes.html'">
        ← Voltar
      </button>

      <h1>Criar publicação</h1>

    </header>


    <section class="criar-container">

      <div class="upload-area">

        <div class="upload-icon">＋</div>

        <h2>Adicionar arte</h2>

        <p>
          Escolha uma imagem ou vídeo para compartilhar
          com a comunidade Arty.
        </p>

        <label for="arquivo" class="btn-arquivo">
          Escolher arquivo
        </label>

        <input
          type="file"
          id="arquivo"
          accept="image/*,video/*"
          hidden>

        <p id="nome-arquivo"></p>

      </div>


      <form id="criarForm">

        <label for="titulo">Título da arte</label>

        <input
          type="text"
          id="titulo"
          placeholder="Ex: Cores da minha cidade"
          required>


        <label for="descricao">Descrição</label>

        <textarea
          id="descricao"
          placeholder="Conte um pouco sobre sua arte..."
          rows="5"
          required></textarea>


        <label for="estilo">Estilo da arte</label>

        <select id="estilo">

          <option value="">Selecione um estilo</option>
          <option>Desenho</option>
          <option>Pintura</option>
          <option>Fotografia</option>
          <option>Arte Digital</option>
          <option>Ilustração</option>
          <option>Escultura</option>
          <option>Outro</option>

        </select>


        <label for="tags">Tags</label>

        <input
          type="text"
          id="tags"
          placeholder="#arte #desenho #criatividade">


        <button type="submit" class="btn-publicar">
          Publicar arte
        </button>

      </form>

    </section>

  </main>


  <script src="js/script.js"></script>

</body>
</html>
